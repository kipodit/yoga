<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Yoga with Adriene</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    .header h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }
    .header p {
      font-size: 1.4rem;
      color: #94a3b8;
      margin-bottom: 2.5rem;
    }

    /* Large TV-friendly button card */
    .yoga-card {
      display: block;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #334155;
      border-radius: 28px;
      padding: 3rem 2rem;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      transition: all 0.2s ease-in-out;
      outline: none;
      cursor: pointer;
    }

    /* Focus state for TV Bro remote D-pad navigation */
    .yoga-card:focus, .yoga-card:hover {
      transform: scale(1.04);
      border-color: #38bdf8;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.6);
      background: linear-gradient(135deg, #1e3a8a, #1e293b);
    }

    .day-badge {
      display: inline-block;
      background-color: #0284c7;
      color: #ffffff;
      padding: 0.5rem 1.4rem;
      border-radius: 50px;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .video-title {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 1.2rem;
      color: #ffffff;
    }
    .video-meta {
      font-size: 1.8rem;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 2rem;
    }
    .btn-action {
      display: inline-block;
      font-size: 1.6rem;
      font-weight: 700;
      background: #e11d48;
      color: white;
      padding: 1rem 2.5rem;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
    }
    .status {
      font-size: 1.8rem;
      color: #94a3b8;
    }
    .error {
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>YOGA WITH ADRIENE</h1>
      <p id="today-date">Loading practice...</p>
    </div>

    <!-- Main clickable TV remote button -->
    <a id="play-button" class="yoga-card" href="#" target="_blank">
      <div id="card-content">
        <div class="status">Finding today's calendar practice...</div>
      </div>
    </a>
  </div>

  <script>
    const CONFIG = {
      // Paste your free YouTube Data API Key here
      API_KEY: 'AIzaSyC7cTA9VoTfR4NiSOv9Uh9bJX70kqNbu9U',
      
      // Yoga With Adriene's official YouTube Channel ID
      CHANNEL_ID: 'UCFKE7WVJfvaHW5q283SxchA'
    };

    // Helper: Parse ISO 8601 duration string (e.g., PT21M45S -> "22 mins")
    function parseDuration(isoDuration) {
      if (!isoDuration) return '';
      const match = isoDuration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!match) return '';
      const hours = parseInt(match[1] || 0);
      const minutes = parseInt(match[2] || 0);
      const seconds = parseInt(match[3] || 0);

      let totalMins = hours * 60 + minutes;
      if (seconds >= 30) totalMins += 1;
      return `${totalMins} mins`;
    }

    // Auto-discover the current month's playlist ID from Adriene's channel
    async function fetchCurrentMonthPlaylistId(apiKey, monthName) {
      const url = `https://www.googleapis.com/youtube/v3/playlists?part=snippet&channelId=${CONFIG.CHANNEL_ID}&maxResults=25&key=${apiKey}`;
      const response = await fetch(url);
      const data = await response.json();

      if (!data.items || data.items.length === 0) {
        throw new Error('Unable to find playlists on Yoga With Adriene channel.');
      }

      // Search channel playlists for current month name (e.g. "October")
      const monthLower = monthName.toLowerCase();
      const monthPlaylist = data.items.find(item => 
        item.snippet.title.toLowerCase().includes(monthLower)
      );

      // Return matching monthly playlist ID, or default to her most recent playlist
      return monthPlaylist ? monthPlaylist.id : data.items[0].id;
    }

    async function loadTodayVideo() {
      const today = new Date();
      const dayOfMonth = today.getDate();
      const monthName = today.toLocaleString('default', { month: 'long' });

      // Update header date
      const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('today-date').innerText = today.toLocaleDateString(undefined, dateOptions);

      const playBtn = document.getElementById('play-button');
      const cardContent = document.getElementById('card-content');

      try {
        if (!CONFIG.API_KEY || CONFIG.API_KEY === 'YOUR_YOUTUBE_API_KEY') {
          throw new Error('Please enter your YouTube API Key in index.html');
        }

        // 1. Automatically find this month's playlist
        const playlistId = await fetchCurrentMonthPlaylistId(CONFIG.API_KEY, monthName);

        // 2. Fetch Playlist Items
        const playlistUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&playlistId=${playlistId}&maxResults=31&key=${CONFIG.API_KEY}`;
        const playlistRes = await fetch(playlistUrl);
        const playlistData = await playlistRes.json();

        if (!playlistData.items || playlistData.items.length === 0) {
          throw new Error('Playlist is empty or invalid.');
        }

        // Match video for today (Day 1 = Index 0, Day 2 = Index 1, etc.)
        const todayIndex = Math.min(dayOfMonth - 1, playlistData.items.length - 1);
        const videoItem = playlistData.items[todayIndex];
        const videoId = videoItem.contentDetails.videoId;
        const videoTitle = videoItem.snippet.title;

        // 3. Fetch exact duration
        const videoUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoId}&key=${CONFIG.API_KEY}`;
        const videoRes = await fetch(videoUrl);
        const videoData = await videoRes.json();

        let durationText = 'Yoga Practice';
        if (videoData.items && videoData.items.length > 0) {
          durationText = parseDuration(videoData.items[0].contentDetails.duration);
        }

        // 4. Update TV UI & direct YouTube link
        playBtn.href = `intent://www.youtube.com/watch?v=${videoId}#Intent;package=com.google.android.youtube.tv;scheme=https;end;`;
        cardContent.innerHTML = `
          <div class="day-badge">Day ${dayOfMonth}</div>
          <div class="video-title">${videoTitle}</div>
          <div class="video-meta">⏱️ ${durationText}</div>
          <div class="btn-action">▶ Start Practice</div>
        `;

        // Auto-focus button for instant TV remote selection
        playBtn.focus();

      } catch (err) {
        console.error(err);
        cardContent.innerHTML = `
          <div class="status error">
            ⚠️ Could not load today's practice<br>
            <span style="font-size: 1.2rem; opacity: 0.8;">${err.message}</span>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', loadTodayVideo);
  </script>
</body>
</html>
