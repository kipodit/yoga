<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoga with Kipod</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Pastel Purple Palette Theme */
        body {
            background: linear-gradient(135deg, #1f1a2e 0%, #2a223f 50%, #362c52 100%);
            color: #ece8f5;
            min-height: 100vh;
            overflow: hidden; /* Recommended for TV interfaces to avoid awkward scrolls */
        }

        /* TV Focus Target Styles */
        .tv-focusable {
            position: relative;
            background-color: rgba(255, 255, 255, 0.08);
            border: 3px solid rgba(255, 255, 255, 0.12);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        /* Pastel Teal Focus Highlights - optimized for 10ft TV viewing */
        .tv-focusable:focus,
        .tv-focusable.is-focused,
        .tv-focusable:hover {
            background-color: #5eead4 !important; /* Pastel Teal */
            color: #0f172a !important; /* Dark Slate text for high contrast */
            border-color: #99f6e4 !important;
            transform: scale(1.02);
            z-index: 20;
        }

        /* Focus subtle glow badge inside elements */
        .tv-focusable:focus .highlight-text,
        .tv-focusable:hover .highlight-text {
            color: #0f172a !important;
        }

        .tv-focusable:focus .badge-accent,
        .tv-focusable:hover .badge-accent {
            background-color: rgba(15, 23, 42, 0.15) !important;
            color: #0f172a !important;
        }

        /* Pulsing indicator for active TV remote feel */
        .focus-ring-pulse {
            display: none;
        }
        .tv-focusable:focus .focus-ring-pulse {
            display: block;
        }
    </style>
</head>
<body class="flex flex-col justify-center gap-3 md:gap-4 p-4 md:p-6 lg:p-8 h-screen w-screen max-w-[1920px] mx-auto select-none">

    <!-- TOP ROW BUTTON -->
    <header class="w-full">
        <button 
            id="top-button"
            tabindex="0"
            autofocus
            class="tv-focusable w-full rounded-2xl p-3.5 md:p-4 flex items-center justify-between shadow-xl text-left transition-all"
        >
            <!-- Left Side: Date Block & Video Title -->
            <div class="flex items-center space-x-4">
                <div class="flex flex-col items-center justify-center bg-purple-900/40 badge-accent px-3 py-1.5 rounded-xl min-w-[65px]">
                    <span id="date-day-name" class="text-[10px] font-bold tracking-widest uppercase opacity-80">---</span>
                    <span id="date-day-num" class="text-xl font-extrabold leading-none my-0.5">--</span>
                    <span id="date-month-name" class="text-[9px] font-bold tracking-wider uppercase opacity-80">---</span>
                </div>
                <div>
                    <h1 id="video-title" class="text-base md:text-lg font-bold tracking-tight highlight-text">Loading today's video...</h1>
                </div>
            </div>

            <!-- Right Side: Duration & Icon -->
            <div class="flex items-center space-x-3">
                <span id="video-duration" class="badge-accent bg-purple-900/40 text-purple-200 px-3 py-1 rounded-lg text-xs md:text-sm font-bold">
                    -- min
                </span>
            </div>
        </button>
    </header>

    <!-- MIDDLE ROW: TWO COLUMNS -->
    <main class="grid grid-cols-2 gap-4 w-full">
        <!-- LEFT COLUMN: DURATION -->
        <section class="flex flex-col space-y-1.5">
            <h2 class="text-xs md:text-sm font-extrabold tracking-wider text-purple-200/80 uppercase px-2 flex items-center gap-2">
                <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Duration
            </h2>
            <div class="flex flex-col space-y-1.5">
                <button tabindex="0" class="tv-focusable w-full rounded-xl py-2.5 px-4 text-left text-sm md:text-base font-bold flex justify-between items-center">
                    <span>15-30 min</span>
                </button>
                <button tabindex="0" class="tv-focusable w-full rounded-xl py-2.5 px-4 text-left text-sm md:text-base font-bold flex justify-between items-center">
                    <span>30-45 min</span>
                </button>
                <button tabindex="0" class="tv-focusable w-full rounded-xl py-2.5 px-4 text-left text-sm md:text-base font-bold flex justify-between items-center">
                    <span>45-60 min</span>
                </button>
            </div>
        </section>

        <!-- RIGHT COLUMN: FOCUS -->
        <section class="flex flex-col space-y-1.5">
            <h2 class="text-xs md:text-sm font-extrabold tracking-wider text-purple-200/80 uppercase px-2 flex items-center gap-2">
                <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                Focus
            </h2>
            <div class="flex flex-col space-y-1.5">
                <button tabindex="0" class="tv-focusable w-full rounded-xl py-2.5 px-4 text-left text-sm md:text-base font-bold flex justify-between items-center">
                    <span>relax</span>
                </button>
                <button tabindex="0" class="tv-focusable w-full rounded-xl py-2.5 px-4 text-left text-sm md:text-base font-bold flex justify-between items-center">
                    <span>stretch</span>
                </button>
                <button tabindex="0" class="tv-focusable w-full rounded-xl py-2.5 px-4 text-left text-sm md:text-base font-bold flex justify-between items-center">
                    <span>power</span>
                </button>
            </div>
        </section>
    </main>

    <!-- BOTTOM ROW BUTTON -->
    <footer class="w-full">
        <button 
            tabindex="0" 
            class="tv-focusable w-full rounded-2xl p-3.5 md:p-4 flex items-center justify-between shadow-2xl text-left"
        >
            <!-- Left Side: PLAY Label & Title -->
            <div class="flex items-center space-x-4">
                <div class="bg-purple-500/30 badge-accent p-2.5 rounded-xl flex items-center justify-center">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="text-base md:text-lg font-bold highlight-text">Yoga Wash - Detox Flow</h2>
                </div>
            </div>

            <!-- Right Side: Duration -->
            <div class="flex items-center space-x-3">
                <span class="badge-accent bg-purple-900/40 text-purple-200 px-3 py-1 rounded-lg text-xs md:text-sm font-bold">
                    23 min
                </span>
            </div>
        </button>
    </footer>

    <script>
        const API_KEY = 'AIzaSyC7cTA9VoTfR4NiSOv9Uh9bJX70kqNbu9U';
        const CHANNEL_ID = 'UCFKE7WVJfvaHW5q283SxchA';

        // Utility: Parse ISO 8601 Duration (e.g., PT36M12S -> "36 min")
        function parseISO8601Duration(isoDuration) {
            if (!isoDuration) return '-- min';
            const match = isoDuration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!match) return '-- min';
            
            const hours = parseInt(match[1] || 0, 10);
            const minutes = parseInt(match[2] || 0, 10);
            
            if (hours > 0) {
                return `${hours * 60 + minutes} min`;
            }
            return `${minutes} min`;
        }

        // Utility: Launch YouTube app using Android Intent scheme (TV Bro / Android TV compatible)
        function openYouTubeVideo(videoId) {
            const intentUrl = `intent://www.youtube.com/watch?v=${videoId}#Intent;package=com.google.android.youtube.tv;scheme=https;end;`;
            const fallbackUrl = `https://www.youtube.com/watch?v=${videoId}`;
            
            try {
                window.location.href = intentUrl;
            } catch (e) {
                window.location.href = fallbackUrl;
            }
        }

        // Update Date UI Elements
        function updateDateHeader() {
            const now = new Date();
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

            document.getElementById('date-day-name').textContent = days[now.getDay()];
            document.getElementById('date-day-num').textContent = now.getDate();
            document.getElementById('date-month-name').textContent = months[now.getMonth()];
        }

        // Fetch YouTube Monthly Playlist & Video of the Day
        async function fetchDailyYogaVideo() {
            const now = new Date();
            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            const currentMonthYear = `${monthNames[now.getMonth()]} ${now.getFullYear()}`;
            const dayOfMonth = now.getDate();

            try {
                // 1. Search for current month playlist in channel
                const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&q=${encodeURIComponent(currentMonthYear)}&type=playlist&key=${API_KEY}`;
                const searchRes = await fetch(searchUrl);
                const searchData = await searchRes.json();

                if (!searchData.items || searchData.items.length === 0) {
                    throw new Error('Playlist not found');
                }

                const playlistId = searchData.items[0].id.playlistId;

                // 2. Fetch playlist items corresponding to the day of the month
                const playlistItemsUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=50&key=${API_KEY}`;
                const playlistRes = await fetch(playlistItemsUrl);
                const playlistData = await playlistRes.json();

                // Get item corresponding to index (dayOfMonth - 1)
                const items = playlistData.items || [];
                const videoItem = items[dayOfMonth - 1] || items[0];

                if (!videoItem) {
                    throw new Error('Video item not found');
                }

                const videoId = videoItem.snippet.resourceId.videoId;
                const videoTitle = videoItem.snippet.title;

                // 3. Fetch video details for duration
                const videoDetailsUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoId}&key=${API_KEY}`;
                const videoRes = await fetch(videoDetailsUrl);
                const videoData = await videoRes.json();

                const rawDuration = videoData.items?.[0]?.contentDetails?.duration;
                const formattedDuration = parseISO8601Duration(rawDuration);

                // Update UI elements
                document.getElementById('video-title').textContent = videoTitle;
                document.getElementById('video-duration').textContent = formattedDuration;

                // Configure click handler on top button
                const topBtn = document.getElementById('top-button');
                topBtn.onclick = () => openYouTubeVideo(videoId);

            } catch (err) {
                console.error('Error fetching YouTube data:', err);
                document.getElementById('video-title').textContent = "Yoga With Adriene - Daily Flow";
                document.getElementById('video-duration').textContent = "-- min";
            }
        }

        // Initialize setup and focus state
        window.addEventListener('DOMContentLoaded', () => {
            updateDateHeader();
            fetchDailyYogaVideo();

            const topButton = document.getElementById('top-button');
            if (topButton) {
                topButton.focus();
            }
        });

        // D-pad Enter press visuals & feedback
        document.addEventListener('keydown', (e) => {
            const active = document.activeElement;
            if (e.key === 'Enter' || e.key === ' ') {
                if (active && active.classList.contains('tv-focusable')) {
                    active.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        active.style.transform = '';
                    }, 150);
                }
            }
        });

        // Pointer/air-mouse support
        const focusableElements = document.querySelectorAll('.tv-focusable');
        focusableElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                el.focus();
            });
        });
    </script>
</body>
</html>
