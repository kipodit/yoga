<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native DPAD Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Prevents unwanted TV scrolling */
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 24px;
      width: 80vw;
      height: 80vh;
    }

    .tv-button {
      background-color: #e0e0e0;
      border: 4px solid #b0b0b0;
      border-radius: 12px;
      font-size: 2rem;
      font-weight: bold;
      color: #333333;
      cursor: pointer;
      outline: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    /* Target both standard native focus and manual JavaScript focus classes */
    .tv-button:focus,
    .tv-button.focused {
      background-color: #000000 !important;
      color: #ffffff !important;
      border-color: #000000 !important;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <button class="tv-button" tabindex="0">Option 1</button>
    <button class="tv-button" tabindex="0">Option 2</button>
    <button class="tv-button" tabindex="0">Option 3</button>
    <button class="tv-button" tabindex="0">Option 4</button>
    <button class="tv-button" tabindex="0">Option 5</button>
    <button class="tv-button" tabindex="0">Option 6</button>
  </div>

  <script>
    const buttons = Array.from(document.querySelectorAll('.tv-button'));
    let currentIndex = 0;

    // Helper to focus a button index and highlight it explicitly
    function setFocus(index) {
      if (index < 0 || index >= buttons.length) return;
      
      buttons.forEach(btn => {
        btn.classList.remove('focused');
        btn.blur();
      });

      currentIndex = index;
      buttons[currentIndex].classList.add('focused');
      buttons[currentIndex].focus();
    }

    // Explicit 2x3 Spatial Navigation Math
    document.addEventListener('keydown', (e) => {
      // Key codes for DPAD/Arrow keys & TV Remote Enter
      const key = e.key;
      const code = e.keyCode;

      // Handle Left (ArrowLeft or DPAD Left - KeyCode 37)
      if (key === 'ArrowLeft' || code === 37) {
        if (currentIndex % 2 !== 0) setFocus(currentIndex - 1);
        e.preventDefault();
      } 
      // Handle Right (ArrowRight or DPAD Right - KeyCode 39)
      else if (key === 'ArrowRight' || code === 39) {
        if (currentIndex % 2 === 0) setFocus(currentIndex + 1);
        e.preventDefault();
      } 
      // Handle Up (ArrowUp or DPAD Up - KeyCode 38)
      else if (key === 'ArrowUp' || code === 38) {
        if (currentIndex >= 2) setFocus(currentIndex - 2);
        e.preventDefault();
      } 
      // Handle Down (ArrowDown or DPAD Down - KeyCode 40)
      else if (key === 'ArrowDown' || code === 40) {
        if (currentIndex <= 3) setFocus(currentIndex + 2);
        e.preventDefault();
      }
      // Handle Select/Enter (Enter / DPAD Center - KeyCode 13 or 23)
      else if (key === 'Enter' || code === 13 || code === 23) {
        buttons[currentIndex].click();
        e.preventDefault();
      }
    });

    // Auto focus first button on load
    window.addEventListener('DOMContentLoaded', () => setFocus(0));
  </script>
</body>
</html>
