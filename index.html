<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrowseHere Pointer-Optimized Grid</title>
  <style>
    /* Reset margins and force full-bleed viewport */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Prevents scrollbars */
      background-color: #ffffff;
      font-family: sans-serif;
    }

    /* 2 columns x 3 rows grid taking up 100% of the screen */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;   /* 2 equal columns */
      grid-template-rows: 1fr 1fr 1fr;  /* 3 equal rows */
      width: 100vw;
      height: 100vh;
    }

    /* Full-bleed interactive hitboxes */
    .tv-tile {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      border: 2px solid #e0e0e0; /* Subtle grid lines */
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      
      /* Center button label */
      display: flex;
      justify-content: center;
      align-items: center;

      /* Smooth transition when hover activates */
      transition: background-color 0.1s ease, color 0.1s ease;
    }

    /* 
      HOVER STATE: 
      Triggers immediately when BrowseHere's virtual pointer enters the tile boundary.
    */
    .tv-tile:hover,
    .tv-tile:focus,
    .tv-tile:active {
      background-color: #000000 !important;
      color: #ffffff !important;
      border-color: #000000 !important;
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <button class="tv-tile" onclick="alert('Option 1 Selected')">Option 1</button>
    <button class="tv-tile" onclick="alert('Option 2 Selected')">Option 2</button>
    <button class="tv-tile" onclick="alert('Option 3 Selected')">Option 3</button>
    <button class="tv-tile" onclick="alert('Option 4 Selected')">Option 4</button>
    <button class="tv-tile" onclick="alert('Option 5 Selected')">Option 5</button>
    <button class="tv-tile" onclick="alert('Option 6 Selected')">Option 6</button>
  </div>

</body>
</html>
